<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Awesome Indian Legal Skills — cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Designed at 1600 × 600 but READ at ~900 px wide on GitHub (≈56 %). Keep every text ≥ 28 px here. */
  :root {
    --bg: #faf7f2; --ink: #15171c; --muted: #4f5563; --rule: #e3ded5;
    --saffron: #e8792b; --green: #1f8a4c; --navy: #1d3b8a; --wm: rgba(21,23,28,0.06);
  }
  .dark {
    --bg: #0e1116; --ink: #f3efe7; --muted: #aab1bd; --rule: #262b33;
    --saffron: #ff9548; --green: #3fc072; --navy: #8ab0ff; --wm: rgba(243,239,231,0.05);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 600px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; position: relative; }
  .tricolour { position: absolute; left: 0; right: 0; top: 0; height: 8px; display: flex; }
  .tricolour span { flex: 1; }
  .tricolour .s { background: var(--saffron); } .tricolour .w { background: var(--rule); } .tricolour .g { background: var(--green); }
  .nyaya { position: absolute; right: 70px; top: 10px; font-family: "Kohinoor Devanagari", "Devanagari Sangam MN", "Noto Sans Devanagari", sans-serif; font-size: 360px; line-height: 1; font-weight: 700; color: var(--wm); letter-spacing: -0.02em; }
  .wrap { position: absolute; inset: 8px 0 0 0; padding: 62px 96px 60px; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { font-size: 24px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 16px; }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--navy); display: inline-block; }
  h1 { font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-weight: 700; font-size: 124px; line-height: 0.96; letter-spacing: -0.025em; margin-top: 26px; font-variation-settings: "opsz" 144; }
  h1 em { font-style: italic; font-weight: 600; color: var(--navy); }
  .sub { margin-top: 30px; font-size: 34px; line-height: 1.32; color: var(--muted); max-width: 1180px; font-weight: 400; }
  .sub b { color: var(--ink); font-weight: 600; }
  .facts { display: flex; align-items: center; gap: 22px; font-size: 28px; color: var(--muted); font-weight: 500; margin-top: 10px; }
  .facts b { color: var(--ink); font-weight: 600; }
  .facts .sep { width: 6px; height: 6px; border-radius: 50%; background: var(--rule); display: inline-block; }
  .mark { position: absolute; right: 96px; bottom: 56px; font-family: "Kohinoor Devanagari", "Devanagari Sangam MN", "Noto Sans Devanagari", sans-serif; font-size: 54px; font-weight: 600; color: var(--ink); line-height: 1.1; }
</style>
</head>
<body>
  <div class="tricolour"><span class="s"></span><span class="w"></span><span class="g"></span></div>
  <div class="nyaya" aria-hidden="true">न्याय</div>
  <div class="wrap">
    <div>
      <div class="eyebrow"><span class="dot"></span> Awesome Indian Legal Skills</div>
      <h1>Agent Skills for<br><em>Indian law.</em></h1>
      <p class="sub">Open-source <b>SKILL.md</b> workflows for Claude Code, Codex and any compatible agent — <b>BNS · BNSS · BSA</b>, cheque bounce, bail, RTI, consumer, RERA, limitation, DPDP.</p>
    </div>
    <div class="facts"><b>19 skills</b><span class="sep"></span>MIT<span class="sep"></span>Verified against official sources<span class="sep"></span>Not legal advice</div>
  </div>
  <div class="mark">सत्यमेव जयते</div>
</body>
</html>
