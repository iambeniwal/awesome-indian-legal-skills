name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Check generated index and marketplace are current
        run: python3 scripts/build.py --check
      - name: Run skill self-tests
        run: |
          for t in skills/*/scripts/test_*.py; do
            [ -e "$t" ] || continue
            echo "== $t"; python3 "$t"
          done
