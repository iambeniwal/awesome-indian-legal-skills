name: governing-code-pre-july-offence
expected_outcome: |
  Explains the two-axis rule: the offence is charged under the IPC (act on 12 March 2024, Article 20(1)), while the proceeding instituted on 5 August 2024 follows the BNSS (s.531 saves only pending proceedings), so bail is under BNSS s.480 (Magistrate) or s.483 (Sessions/High Court), not CrPC s.437/439; mentions that courts have differed on some edge cases and recommends checking the Rajasthan High Court's position.
